name: Pull Request Workflow
on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # - name: Run tests
      #   run: npm run test

      - name: Run lint check
        run: npm run lint

      - name: Build project
        run: npm run build
